name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentsec
          POSTGRES_PASSWORD: agentsec
          POSTGRES_DB: dashboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentsec" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agentsec:agentsec@localhost:5432/dashboard_test
      # agentsec.dashboard first ships in AgentSec 0.9.0. Until then, the add-dashboard commit (pinned, so CI keeps
      # working after that branch is merged and deleted). Switch to invaris-agentsec==0.9.0 once it is published.
      AGENTSEC_REQUIREMENT: invaris-agentsec @ git+https://github.com/invarislabs/invaris-agentsec.git@15f909e615b765b906af00504e0c4959f8fe342f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$AGENTSEC_REQUIREMENT" && pip install -e ".[dev]"
      - run: pytest
      - run: TEST_DATABASE_URL= pytest   # SQLite too, as used for quick local runs
