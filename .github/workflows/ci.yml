name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentsec
          POSTGRES_PASSWORD: agentsec
          POSTGRES_DB: dashboard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agentsec" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agentsec:agentsec@localhost:5432/dashboard_test
      # The engine release this dashboard is tested against; raise it together with pyproject.toml.
      AGENTSEC_REQUIREMENT: invaris-agentsec==0.9.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "$AGENTSEC_REQUIREMENT" && pip install -e ".[dev]"
      - run: pytest
      - run: TEST_DATABASE_URL= pytest   # SQLite too, as used for quick local runs
