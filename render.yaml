# Render Blueprint for the AgentSec dashboard on Render's free web service, with the database on Neon's free plan.
# Step-by-step setup: README.md, "Deploy for free (Render + Neon)". Applying this file creates one free web service
# and nothing else; it never creates a paid instance or a Render database.
services:
  - type: web
    name: agentsec-dashboard
    runtime: docker
    plan: free                      # 512 MB, 0.1 CPU; sleeps after 15 minutes without traffic
    region: singapore               # pick the Neon region closest to this one (AWS Asia Pacific, Singapore)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass   # deploy main only after CI passes
    envVars:
      - key: AGENTSEC_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true           # random 256-bit value generated by Render, never stored in Git
      # Prompted once when the Blueprint is applied; stored only in Render.
      - key: DATABASE_URL             # Neon pooled connection string (host contains "-pooler")
        sync: false
      - key: DATABASE_DIRECT_URL      # Neon direct connection string, used for migrations
        sync: false
      - key: PUBLIC_URL               # https://<service>.onrender.com, no trailing slash
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
