<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330">
<defs><marker id="report-to-dashboard-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-arrow" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="d-group" x="8" y="8" width="226" height="314" rx="12"/>
<text class="d-x" x="22" y="30" text-anchor="start">Your machine or CI</text>
<rect class="d-box" x="24" y="44" width="194" height="52" rx="8"/>
<text class="d-t" x="121" y="67" text-anchor="middle">Run the tests</text>
<text class="d-m" x="121" y="83" text-anchor="middle">agentsec test</text>
<rect class="d-box" x="24" y="128" width="194" height="52" rx="8"/>
<text class="d-t" x="121" y="151" text-anchor="middle">Report file</text>
<text class="d-m" x="121" y="167" text-anchor="middle">.agentsec/report.json</text>
<rect class="d-box" x="24" y="212" width="194" height="60" rx="8"/>
<text class="d-t" x="121" y="231" text-anchor="middle">Upload</text>
<text class="d-m" x="121" y="247" text-anchor="middle">agentsec upload</text>
<text class="d-m" x="121" y="263" text-anchor="middle">or the GitHub Action</text>
<path class="d-line" d="M121,96 V124" marker-end="url(#report-to-dashboard-a)"/>
<path class="d-line" d="M121,180 V208" marker-end="url(#report-to-dashboard-a)"/>
<rect class="d-group" x="300" y="8" width="412" height="314" rx="12"/>
<text class="d-x" x="314" y="30" text-anchor="start">Hosted dashboard</text>
<path class="d-line" d="M218,242 H312" marker-end="url(#report-to-dashboard-a)"/>
<text class="d-s" x="266" y="226" text-anchor="middle">HTTPS</text>
<text class="d-m" x="266" y="262" text-anchor="middle">Bearer asp_…</text>
<circle class="d-numc" cx="332" cy="66" r="10"/>
<text class="d-num" x="332" y="70" text-anchor="middle">1</text>
<rect class="d-box" x="352" y="44" width="344" height="44" rx="8"/>
<text class="d-t" x="366" y="63" text-anchor="start">Check the token</text>
<text class="d-s" x="366" y="79" text-anchor="start">find its project (only a hash is stored)</text>
<path class="d-line" d="M524,88 V96" marker-end="url(#report-to-dashboard-a)"/>
<circle class="d-numc" cx="332" cy="122" r="10"/>
<text class="d-num" x="332" y="126" text-anchor="middle">2</text>
<rect class="d-box" x="352" y="100" width="344" height="44" rx="8"/>
<text class="d-t" x="366" y="119" text-anchor="start">Read the body</text>
<text class="d-s" x="366" y="135" text-anchor="start">up to the plan's size limit, after decompression</text>
<path class="d-line" d="M524,144 V152" marker-end="url(#report-to-dashboard-a)"/>
<circle class="d-numc" cx="332" cy="178" r="10"/>
<text class="d-num" x="332" y="182" text-anchor="middle">3</text>
<rect class="d-box" x="352" y="156" width="344" height="44" rx="8"/>
<text class="d-t" x="366" y="175" text-anchor="start">Check, summarise, store</text>
<text class="d-s" x="366" y="191" text-anchor="start">summarised by AgentSec's code, stored compressed</text>
<path class="d-line" d="M524,200 V208" marker-end="url(#report-to-dashboard-a)"/>
<circle class="d-numc" cx="332" cy="234" r="10"/>
<text class="d-num" x="332" y="238" text-anchor="middle">4</text>
<rect class="d-box" x="352" y="212" width="344" height="44" rx="8"/>
<text class="d-t" x="366" y="231" text-anchor="start">Trim to the plan</text>
<text class="d-s" x="366" y="247" text-anchor="start">the oldest runs beyond the plan's limit are removed</text>
<path class="d-line" d="M524,256 V264" marker-end="url(#report-to-dashboard-a)"/>
<rect class="d-key" x="352" y="268" width="344" height="44" rx="8"/>
<text class="d-t" x="366" y="287" text-anchor="start">The run is in the project</text>
<text class="d-s" x="366" y="303" text-anchor="start">runs, history and comparisons in your browser</text>
